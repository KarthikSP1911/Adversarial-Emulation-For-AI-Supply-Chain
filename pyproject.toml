[project]
name = "modelscan"
version = "0.1.0"
description = "Pre-production checkpoint that inspects an AI model and returns an evidence-backed verdict."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.4",
    "typer>=0.29.2",
]

[project.scripts]
modelscan = "modelscan.cli:app"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
